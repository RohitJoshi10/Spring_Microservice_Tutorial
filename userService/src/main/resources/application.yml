server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/microservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Msql@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        formate_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  application:
    name: USER-SERVICE

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true # By default, it's true you can remove it also.
    service-url:
      defaultZone: http://localhost:8761/eureka # It will be using this url to register to the server