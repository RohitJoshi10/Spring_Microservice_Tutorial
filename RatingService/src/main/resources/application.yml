server:
  port: 8083

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/microservices
  application:
    name: RATING-SERVICE

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true # By default, it's true you can remove it also.
    service-url:
      defaultZone: http://localhost:8761/eureka/ # It will be using this url to register to the server